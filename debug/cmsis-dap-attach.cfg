# Configuration only. Loading this file on the target requires the debug gate.
# No program/erase/reset command is included.
source [find interface/cmsis-dap.cfg]
adapter serial FS-00000000
transport select swd
source [find target/stm32f1x.cfg]
reset_config none
# The stock STM32 script modifies DBGMCU_CR at examine-end (freezes watchdogs).
# Suppress that automatic target write. SWD/debug-control setup still changes
# debug state: do not call an attach session "zero hardware writes".
$_TARGETNAME configure -event examine-end {}
$_TARGETNAME configure -event gdb-attach {}
